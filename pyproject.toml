[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "material-knowledge-graph"
version = "0.2.0"
description = "Material knowledge-graph ingestion, extraction, AGE/LightRAG persistence, and layout tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
rag = ["lightrag-hku>=1.5,<2", "asyncpg>=0.31,<1", "pgvector>=0.4,<1"]
database = ["psycopg[binary,pool]>=3.2,<4"]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio==1.3.0",
  "pytest-cov>=5",
  "coverage>=7",
  "ruff==0.12.0",
  "jsonschema>=4.20",
  "pyyaml>=6.0",
]

[project.scripts]
material-graph-knowledge = "material_graph.knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
